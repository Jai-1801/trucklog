<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Plan an HOS-compliant truck trip and get filled-out FMCSA daily log sheets." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>TruckLog · HOS Trip Planner</title>
  </head>
  <body>
    <!-- Preloader: shown before any JS loads, faded out by main.tsx once fonts are ready. -->
    <div id="splash" role="status" aria-label="Loading TruckLog">
      <div class="splash-inner">
        <div class="splash-logo">
          <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg>
        </div>
        <p class="splash-name">TruckLog</p>
        <p class="splash-tag">Trip planner &amp; FMCSA daily logs</p>
        <div class="splash-bar"><span></span></div>
      </div>
    </div>
    <style>
      /* JS fades the splash when ready; the animation is a fail-safe so it can never stick. */
      #splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #f5f7fa; transition: opacity 0.35s ease, visibility 0.35s; animation: splash-failsafe 0.35s ease 4s forwards; }
      @keyframes splash-failsafe { to { opacity: 0; visibility: hidden; } }
      #splash.is-done { opacity: 0; visibility: hidden; }
      .splash-inner { text-align: center; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
      .splash-logo { width: 64px; height: 64px; margin: 0 auto; display: grid; place-items: center; border-radius: 18px; background: #2563eb; box-shadow: 0 10px 30px rgb(37 99 235 / 0.35); animation: splash-pop 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.3) both; }
      .splash-name { margin: 18px 0 0; font-size: 20px; font-weight: 800; letter-spacing: -0.02em; color: #0b1324; }
      .splash-tag { margin: 4px 0 0; font-size: 13px; color: #5d6779; }
      .splash-bar { width: 140px; height: 4px; margin: 20px auto 0; border-radius: 4px; background: #e6e9ef; overflow: hidden; }
      .splash-bar span { display: block; width: 40%; height: 100%; border-radius: 4px; background: #2563eb; animation: splash-slide 1.1s ease-in-out infinite; }
      @keyframes splash-slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
      @keyframes splash-pop { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
      @media print { #splash { display: none; } }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

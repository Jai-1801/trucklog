<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Plan an HOS-compliant truck trip and get filled-out FMCSA daily log sheets." />
    <title>TruckLog · HOS Trip Planner</title>
  </head>
  <body>
    <!-- Preloader: shown before any JS loads, faded out by main.tsx once the font is ready. -->
    <div id="splash" role="status" aria-label="Loading TruckLog">
      <div class="splash-inner">
        <p class="splash-name">TruckLog</p>
        <div class="splash-bar"><span></span></div>
      </div>
    </div>
    <style>
      /* JS fades the splash when ready; the animation is a fail-safe so it can never stick. */
      #splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #fff; transition: opacity 0.3s ease, visibility 0.3s; animation: splash-failsafe 0.3s ease 4s forwards; }
      #splash.is-done { opacity: 0; visibility: hidden; }
      @keyframes splash-failsafe { to { opacity: 0; visibility: hidden; } }
      .splash-inner { width: 160px; }
      .splash-name { margin: 0; font: 600 20px/1 'Plus Jakarta Sans Variable', system-ui, sans-serif; letter-spacing: -0.02em; color: #1c1917; }
      .splash-bar { height: 2px; margin-top: 14px; background: #e7e5e4; overflow: hidden; }
      .splash-bar span { display: block; width: 35%; height: 100%; background: #ea580c; animation: splash-slide 1s ease-in-out infinite; }
      @keyframes splash-slide { from { transform: translateX(-100%); } to { transform: translateX(290%); } }
      @media print { #splash { display: none; } }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
